spring.application.name=library
# Server
server.port=9090

# Database
spring.datasource.url=jdbc:mysql://localhost:3305/library
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.My  SQL8Dialect
# spring.jpa.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# File upload settings
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.enabled=true
# Drain the full request body on rejected uploads so the browser receives the JSON error
# instead of a mid-upload connection reset (which shows up as a generic "network error")
server.tomcat.max-swallow-size=-1

# Digital resources (PDF) local storage
app.pdf.storage-dir=uploads/pdf

