<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sign In · Smart Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
                    animation: {
                        'fade-up': 'fadeUp .6s cubic-bezier(.22,1,.36,1) both'
                    },
                    keyframes: {
                        fadeUp: {
                            '0%': { opacity: '0', transform: 'translateY(24px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(24px) saturate(160%);
            -webkit-backdrop-filter: blur(24px) saturate(160%);
        }
        .glass-input {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.16);
        }
        .glass-input:focus-within {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(165, 180, 252, 0.9);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.25);
        }
        .glass-input input { color-scheme: dark; }
    </style>
</head>
<body class="font-sans antialiased min-h-dvh bg-gradient-to-br from-indigo-950 via-violet-900 to-fuchsia-900">

    <!-- Fixed decorative background (never clips the form) -->
    <div aria-hidden="true" class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-32 -left-32 w-96 h-96 rounded-full bg-indigo-500/30 blur-3xl"></div>
        <div class="absolute top-1/3 -right-24 w-[28rem] h-[28rem] rounded-full bg-fuchsia-500/25 blur-3xl"></div>
        <div class="absolute -bottom-40 left-1/4 w-[26rem] h-[26rem] rounded-full bg-violet-600/30 blur-3xl"></div>
        <div class="absolute inset-0" style="background-image: radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px); background-size: 28px 28px;"></div>
    </div>

    <!-- Centered on both axes, fits 100vh: h-dvh with safe internal padding -->
    <div class="relative z-10 min-h-dvh flex items-center justify-center px-3 sm:px-6 py-3 sm:py-6">
        <main class="w-full max-w-md animate-fade-up">
            <!-- Brand header (compact) -->
            <div class="flex items-center justify-center gap-3 text-center mb-3 sm:mb-4">
                <div class="w-11 h-11 sm:w-12 sm:h-12 rounded-2xl bg-gradient-to-br from-indigo-400 to-fuchsia-500 shadow-lg shadow-indigo-900/50 flex items-center justify-center ring-1 ring-white/25 shrink-0">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 0 0 6 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 0 1 6 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 0 1 6-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0 0 18 18a8.967 8.967 0 0 0-6 2.292m0-14.25v14.25"/>
                    </svg>
                </div>
                <div class="text-left">
                    <h1 class="text-xl sm:text-2xl font-extrabold tracking-tight text-white leading-tight">Smart Library</h1>
                    <p class="text-[11px] sm:text-xs text-indigo-200/80 leading-tight">Books, members &amp; digital resources</p>
                </div>
            </div>

            <!-- Glass card -->
            <div class="glass rounded-3xl sm:rounded-[2rem] p-4 sm:p-7 shadow-2xl shadow-indigo-950/60 ring-1 ring-white/15">

                <!-- Login error -->
                <div th:if="${error}" role="alert"
                     class="mb-3 flex items-start gap-2.5 rounded-xl border border-red-400/40 bg-red-500/15 px-3 py-2 text-xs sm:text-sm text-red-100">
                    <svg class="w-4 h-4 sm:w-5 sm:h-5 shrink-0 mt-0.5 text-red-300" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z"/>
                    </svg>
                    <span class="flex-1 font-medium" th:text="${error}"></span>
                    <button type="button" onclick="this.parentElement.remove()" class="text-red-200/70 hover:text-white transition" aria-label="Dismiss">
                        <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/></svg>
                    </button>
                </div>

                <!-- Logout / success message -->
                <div th:if="${message}" role="status"
                     class="mb-3 flex items-start gap-2.5 rounded-xl border border-emerald-400/40 bg-emerald-500/15 px-3 py-2 text-xs sm:text-sm text-emerald-100">
                    <svg class="w-4 h-4 sm:w-5 sm:h-5 shrink-0 mt-0.5 text-emerald-300" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/>
                    </svg>
                    <span class="flex-1 font-medium" th:text="${message}"></span>
                    <button type="button" onclick="this.parentElement.remove()" class="text-emerald-200/70 hover:text-white transition" aria-label="Dismiss">
                        <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/></svg>
                    </button>
                </div>

                <h2 class="text-base sm:text-lg font-bold text-white">Welcome back</h2>
                <p class="text-[11px] sm:text-sm text-indigo-200/70 mb-3 sm:mb-4">Please enter your account details</p>

                <!-- Spring Security form login: field name must stay "username" -->
                <form id="loginForm" th:action="@{/api/login}" method="post" novalidate>
                    <div class="mb-3">
                        <label for="email" class="block mb-1 text-[11px] sm:text-xs font-semibold text-indigo-100 uppercase tracking-wide">Email address</label>
                        <div class="glass-input flex items-center gap-2.5 rounded-xl px-3 transition-all duration-200">
                            <svg class="w-4 h-4 sm:w-5 sm:h-5 shrink-0 text-indigo-300" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75"/>
                            </svg>
                            <input type="email" id="email" name="username" required autocomplete="username" placeholder="you@example.com"
                                   class="w-full min-w-0 bg-transparent border-0 outline-none py-2 text-sm text-white placeholder-indigo-300/50 focus:ring-0">
                        </div>
                        <p class="hidden mt-1 text-xs text-red-300" data-error-for="email">Email is required</p>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="block mb-1 text-[11px] sm:text-xs font-semibold text-indigo-100 uppercase tracking-wide">Password</label>
                        <div class="glass-input flex items-center gap-2.5 rounded-xl px-3 transition-all duration-200">
                            <svg class="w-4 h-4 sm:w-5 sm:h-5 shrink-0 text-indigo-300" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z"/>
                            </svg>
                            <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••"
                                   class="w-full min-w-0 bg-transparent border-0 outline-none py-2 text-sm text-white placeholder-indigo-300/50 focus:ring-0">
                            <button type="button" data-toggle-password="password" class="p-1 -mr-1 text-indigo-300 hover:text-white transition" aria-label="Show password">
                                <svg class="w-4 h-4 sm:w-5 sm:h-5 eye-open" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z"/>
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/>
                                </svg>
                                <svg class="w-4 h-4 sm:w-5 sm:h-5 eye-off hidden" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12c3.291-4.973 8.963-7.5 10.066-7.5a9.921 9.921 0 0 1 1.533.188m-.066 2.888a8.897 8.897 0 0 0-3.93 5.193 9.03 9.03 0 0 0 1.626 2.487m9.714-.586a9.948 9.948 0 0 0 2.896-4.827 10.476 10.476 0 0 0-2.046-3.777M12 19.5a9.9 9.9 0 0 1-2.952-.445m-.018-2.971a3 3 0 1 0 4.248-4.248M3 3l18 18"/>
                                </svg>
                            </button>
                        </div>
                        <p class="hidden mt-1 text-xs text-red-300" data-error-for="password">Password is required</p>
                    </div>

                    <button type="submit"
                            class="group relative w-full overflow-hidden rounded-xl bg-gradient-to-r from-indigo-500 to-fuchsia-500 px-5 py-2.5 text-sm font-bold text-white shadow-lg shadow-indigo-900/50 transition-all duration-200 hover:shadow-xl hover:shadow-fuchsia-900/40 hover:-translate-y-0.5 active:translate-y-0 active:scale-[0.99] focus:outline-none focus-visible:ring-4 focus-visible:ring-indigo-400/50">
                        <span class="relative z-10 flex items-center justify-center gap-2">
                            Sign in
                            <svg class="w-4 h-4 transition-transform duration-200 group-hover:translate-x-1" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3"/>
                            </svg>
                        </span>
                        <span class="absolute inset-0 -translate-x-full bg-gradient-to-r from-transparent via-white/25 to-transparent transition-transform duration-700 group-hover:translate-x-full"></span>
                    </button>
                </form>

                <div class="mt-4 pt-3 border-t border-white/10 text-center">
                    <p class="text-xs sm:text-sm text-indigo-200/80">
                        Don't have an account?
                        <a th:href="@{/register}" class="font-semibold text-white underline-offset-4 hover:underline hover:text-fuchsia-300 transition">Register here</a>
                        <span class="mx-2 text-indigo-300/40">·</span>
                        <a th:href="@{/}" class="text-indigo-300/80 hover:text-white transition underline-offset-4 hover:underline">Home</a>
                    </p>
                </div>
            </div>

            <p class="mt-2 text-center text-[10px] sm:text-xs text-indigo-300/50">© 2026 Smart Library · Digital Resource Management System</p>
        </main>
    </div>

    <script>
        document.querySelectorAll('[data-toggle-password]').forEach(function (btn) {
            btn.addEventListener('click', function () {
                var input = document.getElementById(btn.getAttribute('data-toggle-password'));
                var show = input.type === 'password';
                input.type = show ? 'text' : 'password';
                btn.querySelector('.eye-open').classList.toggle('hidden', show);
                btn.querySelector('.eye-off').classList.toggle('hidden', !show);
                btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
                input.focus();
            });
        });

        document.getElementById('loginForm').addEventListener('submit', function (e) {
            var valid = true;
            ['email', 'password'].forEach(function (id) {
                var input = document.getElementById(id);
                var err = document.querySelector('[data-error-for="' + id + '"]');
                if (!input.value.trim()) {
                    err.classList.remove('hidden');
                    input.closest('.glass-input').style.borderColor = 'rgba(248,113,113,.8)';
                    valid = false;
                } else {
                    err.classList.add('hidden');
                    input.closest('.glass-input').style.borderColor = '';
                }
            });
            if (!valid) e.preventDefault();
        });

        ['email', 'password'].forEach(function (id) {
            document.getElementById(id).addEventListener('input', function () {
                document.querySelector('[data-error-for="' + id + '"]').classList.add('hidden');
                this.closest('.glass-input').style.borderColor = '';
            });
        });
    </script>
</body>
</html>
