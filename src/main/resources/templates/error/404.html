<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>404 · Page Not Found — Smart Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
                    animation: { 'fade-up': 'fadeUp .6s cubic-bezier(.22,1,.36,1) both' },
                    keyframes: {
                        fadeUp: {
                            '0%': { opacity: '0', transform: 'translateY(24px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(24px) saturate(160%);
            -webkit-backdrop-filter: blur(24px) saturate(160%);
        }
    </style>
</head>
<body class="font-sans antialiased min-h-dvh bg-gradient-to-br from-indigo-950 via-violet-900 to-fuchsia-900">

    <div aria-hidden="true" class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-32 -left-32 w-96 h-96 rounded-full bg-indigo-500/30 blur-3xl"></div>
        <div class="absolute top-1/3 -right-24 w-[28rem] h-[28rem] rounded-full bg-fuchsia-500/25 blur-3xl"></div>
        <div class="absolute -bottom-40 left-1/4 w-[26rem] h-[26rem] rounded-full bg-violet-600/30 blur-3xl"></div>
        <div class="absolute inset-0" style="background-image: radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px); background-size: 28px 28px;"></div>
    </div>

    <div class="relative z-10 min-h-dvh flex items-center justify-center px-4 sm:px-6 py-8">
        <main class="w-full max-w-lg animate-fade-up text-center" th:with="msg=${message != null and !#strings.isEmpty(message)} ? ${message} : 'The page you are looking for was shelved somewhere else.'">
            <div class="glass rounded-[2rem] p-8 sm:p-12 shadow-2xl shadow-indigo-950/60 ring-1 ring-white/15">
                <div class="mx-auto w-16 h-16 rounded-3xl bg-gradient-to-br from-indigo-400 to-fuchsia-500 shadow-lg shadow-indigo-900/50 flex items-center justify-center ring-1 ring-white/25 mb-6">
                    <svg class="w-9 h-9 text-white" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 0 0 6 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 0 1 6 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 0 1 6-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0 0 18 18a8.967 8.967 0 0 0-6 2.292m0-14.25v14.25"/>
                    </svg>
                </div>

                <p class="text-7xl sm:text-8xl font-black tracking-tight bg-gradient-to-r from-indigo-300 via-fuchsia-300 to-violet-300 bg-clip-text text-transparent leading-none"
                   th:text="${status != null} ? ${status} : '404'">404</p>

                <h1 class="mt-4 text-xl sm:text-2xl font-extrabold text-white">Page Not Found</h1>
                <p class="mt-2 text-sm text-indigo-200/80 leading-relaxed" th:text="${msg}">
                    The page you are looking for was shelved somewhere else.
                </p>
                <p th:if="${path != null and !#strings.isEmpty(path)}"
                   class="mt-3 inline-block max-w-full truncate rounded-xl ring-1 ring-white/15 bg-white/5 px-3 py-1 text-[11px] font-mono text-indigo-300/80"
                   th:text="${path}">/missing</p>

                <div class="mt-8 grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <a th:href="@{/dashboard}"
                       class="inline-flex items-center justify-center gap-2 rounded-2xl bg-gradient-to-r from-indigo-500 to-fuchsia-500 px-5 py-3 text-sm font-bold text-white shadow-lg shadow-indigo-900/50 hover:-translate-y-0.5 hover:shadow-xl hover:shadow-fuchsia-900/40 active:scale-[0.99] transition-all duration-200">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75"/></svg>
                        Back to Dashboard
                    </a>
                    <a th:href="@{/}"
                       class="inline-flex items-center justify-center gap-2 rounded-2xl ring-1 ring-white/25 px-5 py-3 text-sm font-semibold text-indigo-100 hover:bg-white/10 hover:text-white active:scale-[0.99] transition-all duration-200">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18"/></svg>
                        Go Home
                    </a>
                </div>
            </div>

            <p class="mt-6 text-[11px] text-indigo-300/50">© 2026 Smart Library · Digital Resource Management System</p>
        </main>
    </div>
</body>
</html>
